name: Relatar um bug
description: Informe um comportamento incorreto ou inesperado.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado pelo relato. Não inclua tokens, conteúdo do `.env` ou dados pessoais.
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Explique o que aconteceu e o que deveria acontecer.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Liste os comandos e passos mínimos, usando dados fictícios.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Versão do Node.js
      placeholder: "22.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs sanitizados
      description: Remova tokens, IDs privados e dados pessoais antes de colar.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Confirmei que não há credenciais ou dados pessoais neste relato.
          required: true
        - label: Pesquisei as issues existentes.
          required: true
